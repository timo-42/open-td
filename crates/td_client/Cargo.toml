[package]
name = "td_client"
description = "open-td Bevy client: rendering, input, HUD, generator forms"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-td"
path = "src/main.rs"

[features]
# Bake the base pack zip named by the TD_EMBED_PACK env var into the binary.
embed-pack = []

[dependencies]
td_mod_api = { workspace = true }
td_core = { workspace = true }
td_content = { workspace = true }
td_headless = { path = "../td_headless" }
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "ui", "png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
