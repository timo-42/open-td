<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open-td</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121217; overflow: hidden; }
    #open-td { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #ddd; font: 18px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="open-td" tabindex="0"></canvas>
  <div id="loading">Loading open-td…</div>
  <script type="module">
    import init from "./open-td.js";
    init().catch((e) => {
      // Bevy exits its event loop by throwing; anything else is a real error.
      if (!String(e).includes("Using exceptions for control flow")) {
        document.getElementById("loading").textContent = "Failed to start: " + e;
        throw e;
      }
    });
    const hide = () => document.getElementById("loading").remove();
    new MutationObserver((_, o) => { hide(); o.disconnect(); })
      .observe(document.getElementById("open-td"), { attributes: true });
  </script>
</body>
</html>
