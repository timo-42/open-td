name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo xtask modules
      - run: cargo test --workspace --exclude td_client
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Base map balance (bots)
        run: cargo run --release -p td_headless -- --map first_steps --bots --quiet

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-14
            target: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Bevy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo xtask pack
      - run: cargo build --release --target ${{ matrix.target }} -p td_client -p td_headless
      - name: Bundle
        shell: bash
        run: |
          name=open-td-${{ matrix.target }}
          mkdir -p "$name/packs"
          cp target/${{ matrix.target }}/release/open-td${{ matrix.exe }} target/${{ matrix.target }}/release/td_headless${{ matrix.exe }} "$name/"
          cp -r packs/base "$name/packs/base"
          cp dist/base-*.zip README.md LICENSE "$name/"
          7z a "$name.zip" "$name" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: open-td-${{ matrix.target }}
          path: open-td-${{ matrix.target }}.zip

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (version pinned by Cargo.lock)
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo xtask wasm-bindgen-version)"
      - run: cargo xtask web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: base-pack
          path: dist/base-*.zip

  pages:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
